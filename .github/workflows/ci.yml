name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.tokencashflow.com
            VITE_CLIENT_PORTAL_URL=https://app.tokencashflow.com
            VITE_DOCS_URL=https://docs.tokencashflow.com
          tags: |
            ghcr.io/${{ github.repository_owner }}/tcf-landing:latest
            ghcr.io/${{ github.repository_owner }}/tcf-landing:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update k8s manifest with new image tag
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/tcf-landing:sha-${{ github.sha }}"
          sed -i "s|image: ghcr.io/.*/tcf-landing:.*|image: ${IMAGE}|g" k8s/deployment.yaml
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add k8s/deployment.yaml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ci: update image to sha-${{ github.sha }} [skip ci]"
          git push
