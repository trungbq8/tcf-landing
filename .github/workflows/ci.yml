name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE_URL=https://api.tokencashflow.com
            VITE_CLIENT_PORTAL_URL=https://app.tokencashflow.com
            VITE_DOCS_URL=https://docs.tokencashflow.com
          tags: |
            ghcr.io/${{ github.repository_owner }}/tcf-landing:latest
            ghcr.io/${{ github.repository_owner }}/tcf-landing:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Checkout tcf-gitops
        uses: actions/checkout@v4
        with:
          repository: trungbq8/tcf-gitops
          path: tcf-gitops
          token: ${{ secrets.GITOPS_PAT }}
          ref: main

      - name: Bump image tag in tcf-gitops
        uses: mikefarah/yq@v4.53.6
        with:
          cmd: yq -i '.images[0].newTag = "sha-${{ github.sha }}"' tcf-gitops/apps/landing/overlays/prod/kustomization.yaml

      - name: Open deploy PR in tcf-gitops
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITOPS_PAT }}
          path: tcf-gitops
          commit-message: "deploy(landing): sha-${{ github.sha }}"
          title: "deploy(landing): sha-${{ github.sha }}"
          body: |
            Automated image update from `${{ github.repository }}`.

            - Image: `ghcr.io/trungbq8/tcf-landing:sha-${{ github.sha }}`
            - Source commit: ${{ github.event.head_commit.message }}
            - Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: deploy/landing-sha-${{ github.sha }}
          delete-branch: true
          labels: |
            deploy
            automated
