apiVersion: apps/v1
kind: Deployment
metadata:
  name: tcf-landing
  namespace: tcf
  labels:
    app: tcf-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tcf-landing
  template:
    metadata:
      labels:
        app: tcf-landing
    spec:
      imagePullSecrets: [{name: ghcr-pull-secret}]
      containers:
        - name: tcf-landing
          image: ghcr.io/trungbq8/tcf-landing:sha-fed840b82c11943dd7e44c401976cefabf4c64f8
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tcf-landing
  namespace: tcf
spec:
  selector:
    app: tcf-landing
  ports:
    - name: http
      port: 80
      targetPort: 80
