apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tcf-landing-ingress
  namespace: tcf
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - tokencashflow.com
        - www.tokencashflow.com
      secretName: tcf-landing-tls
  rules:
    - host: tokencashflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tcf-landing
                port:
                  number: 80
    - host: www.tokencashflow.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tcf-landing
                port:
                  number: 80
